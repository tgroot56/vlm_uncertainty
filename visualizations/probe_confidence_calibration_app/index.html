<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Qualitative Probe Confidence Samples</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef1f4;
      --panel: #ffffff;
      --ink: #17202a;
      --muted: #647084;
      --line: #d9dee7;
      --probe: #126b76;
      --answer: #a15c07;
      --ok: #147342;
      --bad: #c43d30;
      --soft: #f7f9fb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .toolbar {
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 18px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 3;
    }
    .toolbar-title { color: var(--muted); font-size: 14px; }
    .controls { display: flex; gap: 8px; align-items: center; }
    select, button {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      padding: 0 10px;
      font: inherit;
    }
    button { cursor: pointer; }
    button:hover { border-color: #9aa7b7; }
    main {
      padding: 22px;
      display: grid;
      place-items: center;
    }
    .slide {
      width: min(100%, 1600px);
      aspect-ratio: 16 / 9;
      background: #fff;
      box-shadow: 0 16px 42px rgba(16, 24, 40, 0.16);
      padding: 34px 42px 28px;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 16px;
      overflow: hidden;
    }
    .header {
      display: flex;
      justify-content: space-between;
      gap: 28px;
      align-items: start;
    }
    h1 {
      margin: 0;
      font-size: 38px;
      line-height: 1.06;
      letter-spacing: 0;
      max-width: 980px;
    }
    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 16px;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(2, 160px);
      gap: 8px;
    }
    .metric {
      border: 1px solid var(--line);
      background: var(--soft);
      border-radius: 7px;
      padding: 9px 12px;
      text-align: right;
    }
    .metric span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
      margin-bottom: 3px;
    }
    .metric strong {
      font-size: 21px;
      color: var(--probe);
    }
    .legend {
      display: flex;
      align-items: center;
      gap: 18px;
      color: var(--muted);
      font-size: 13px;
    }
    .legend-item { display: inline-flex; align-items: center; gap: 7px; }
    .swatch { width: 18px; height: 8px; border-radius: 999px; display: inline-block; }
    .dot { width: 9px; height: 9px; border-radius: 999px; display: inline-block; }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      min-height: 0;
    }
    .card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
      display: grid;
      grid-template-rows: 142px auto;
      min-width: 0;
    }
    .card img {
      width: 100%;
      height: 142px;
      object-fit: cover;
      display: block;
      background: #eef1f5;
    }
    .card-body {
      padding: 9px 10px 10px;
      display: grid;
      gap: 7px;
      min-width: 0;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      min-width: 0;
    }
    .dataset {
      font-size: 11px;
      font-weight: 760;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status {
      font-size: 11px;
      font-weight: 800;
      color: #fff;
      padding: 2px 7px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .status.correct { background: var(--ok); }
    .status.wrong { background: var(--bad); }
    .question {
      font-size: 13px;
      line-height: 1.25;
      font-weight: 720;
      min-height: 48px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .answer-line {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
      min-height: 30px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .bars {
      display: grid;
      gap: 5px;
    }
    .bar-row {
      display: grid;
      grid-template-columns: 52px 1fr 38px;
      gap: 7px;
      align-items: center;
      font-size: 11px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .track {
      height: 8px;
      background: #e8edf3;
      border-radius: 999px;
      overflow: hidden;
    }
    .fill {
      height: 100%;
      border-radius: 999px;
      min-width: 2px;
    }
    .case {
      min-height: 28px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.2;
    }
    .footer {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      color: var(--muted);
      font-size: 12px;
    }
    @media (max-width: 980px) {
      main { padding: 12px; place-items: start; }
      .slide { width: 1600px; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="toolbar-title">Qualitative sample view · image, question, answer confidence, probe confidence</div>
    <div class="controls">
      <select id="viewMode">
        <option value="featured">Featured calibration contrasts</option>
        <option value="vqa-v2">VQA-v2 samples</option>
        <option value="coco-qa-vi">COCO-QA-VI samples</option>
        <option value="imagenet-r">ImageNet-R samples</option>
        <option value="pope/random">POPE random samples</option>
      </select>
      <select id="pageSelect"></select>
      <button id="exportPng">Export PNG</button>
    </div>
  </div>
  <main>
    <section class="slide" id="slide">
      <div class="header">
        <div>
          <h1 id="title"></h1>
          <p class="subtitle" id="subtitle"></p>
        </div>
        <div class="metrics">
          <div class="metric"><span>Mean answer ECE</span><strong id="answerEce"></strong></div>
          <div class="metric"><span>Mean probe ECE</span><strong id="probeEce"></strong></div>
        </div>
      </div>
      <div class="legend">
        <span class="legend-item"><span class="swatch" style="background:var(--answer)"></span>Answer confidence</span>
        <span class="legend-item"><span class="swatch" style="background:var(--probe)"></span>Probe confidence</span>
        <span class="legend-item"><span class="dot" style="background:var(--ok)"></span>Correct</span>
        <span class="legend-item"><span class="dot" style="background:var(--bad)"></span>Incorrect</span>
      </div>
      <div class="grid" id="grid"></div>
      <div class="footer">
        <span id="footerLeft"></span>
        <span>100 qualitative samples are available per dataset; this slide shows 16 at a time.</span>
      </div>
    </section>
  </main>

  <script src="data.js"></script>
  <script>
    const data = window.CALIBRATION_DATA;
    const modeSelect = document.getElementById('viewMode');
    const pageSelect = document.getElementById('pageSelect');
    const grid = document.getElementById('grid');
    const PAGE_SIZE = 16;

    const fmt = (x) => Number(x).toFixed(3);
    const pct = (x) => `${Math.round(Number(x) * 100)}%`;
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    function samplesForMode(mode) {
      if (mode === 'featured') {
        return data.datasets.flatMap(ds => ds.featured_samples.map(sample => ({...sample, datasetName: ds.name})));
      }
      const ds = data.datasets.find(item => item.id === mode);
      return ds.samples.map(sample => ({...sample, datasetName: ds.name}));
    }

    function configurePages() {
      const samples = samplesForMode(modeSelect.value);
      const pages = Math.max(1, Math.ceil(samples.length / PAGE_SIZE));
      pageSelect.innerHTML = Array.from({length: pages}, (_, idx) => `<option value="${idx}">Page ${idx + 1} of ${pages}</option>`).join('');
    }

    function confidenceBar(label, value, cls) {
      return `<div class="bar-row"><span>${label}</span><div class="track"><div class="fill" style="width:${Math.max(2, Math.min(100, value * 100))}%; background:var(--${cls})"></div></div><strong>${pct(value)}</strong></div>`;
    }

    function card(sample) {
      return `<article class="card">
        <img src="${esc(sample.image_path)}" alt="" />
        <div class="card-body">
          <div class="card-top">
            <div class="dataset">${esc(sample.datasetName)}</div>
            <div class="status ${sample.correct ? 'correct' : 'wrong'}">${sample.correct ? 'correct' : 'wrong'}</div>
          </div>
          <div class="question">${esc(sample.question)}</div>
          <div class="answer-line"><strong>Answer:</strong> ${esc(sample.answer)}<br><strong>GT:</strong> ${esc(sample.ground_truth)}</div>
          <div class="bars">
            ${confidenceBar('Answer', sample.answer_confidence, 'answer')}
            ${confidenceBar('Probe', sample.probe_confidence, 'probe')}
          </div>
          <div class="case">${esc(sample.case)}</div>
        </div>
      </article>`;
    }

    function render() {
      const mode = modeSelect.value;
      const samples = samplesForMode(mode);
      const page = Number(pageSelect.value || 0);
      const shown = samples.slice(page * PAGE_SIZE, page * PAGE_SIZE + PAGE_SIZE);
      const label = mode === 'featured' ? 'Featured calibration contrasts' : data.datasets.find(ds => ds.id === mode).name;

      document.getElementById('title').textContent = data.title;
      document.getElementById('subtitle').textContent = `${label}: qualitative examples with model answer, ground truth, answer confidence, and probe confidence.`;
      document.getElementById('answerEce').textContent = fmt(data.summary.avg_answer_ece);
      document.getElementById('probeEce').textContent = fmt(data.summary.avg_probe_ece);
      document.getElementById('footerLeft').textContent = `Confidence source: ${data.answer_confidence_feature}; probe: ${data.probe_feature}.`;
      grid.innerHTML = shown.map(card).join('');
    }

    function exportPng() {
      html2canvasLike(document.getElementById('slide'), 2);
    }

    function html2canvasLike(node, scale) {
      const css = document.querySelector('style').textContent;
      const clone = node.cloneNode(true);
      clone.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml');
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${node.offsetWidth * scale}" height="${node.offsetHeight * scale}">
        <foreignObject width="100%" height="100%" transform="scale(${scale})">
          <div xmlns="http://www.w3.org/1999/xhtml">
            <style>${css}</style>
            ${new XMLSerializer().serializeToString(clone)}
          </div>
        </foreignObject>
      </svg>`;
      const blob = new Blob([svg], {type: 'image/svg+xml;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = node.offsetWidth * scale;
        canvas.height = node.offsetHeight * scale;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0);
        URL.revokeObjectURL(url);
        const link = document.createElement('a');
        link.download = 'qualitative-probe-confidence-samples.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      };
      img.src = url;
    }

    modeSelect.addEventListener('input', () => { configurePages(); render(); });
    pageSelect.addEventListener('input', render);
    document.getElementById('exportPng').addEventListener('click', exportPng);
    configurePages();
    render();
  </script>
</body>
</html>
